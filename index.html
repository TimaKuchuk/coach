<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fit Challenge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#111827);
  --hint:var(--tg-theme-hint-color,#6b7280);--card:var(--tg-theme-secondary-bg-color,#f3f4f6);
  --btn:var(--tg-theme-button-color,#2563eb);--btn-text:var(--tg-theme-button-text-color,#fff);
  --ok:#16a34a;--warn:#d97706;--road:#cbd5e1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
#app{padding:16px;max-width:560px;margin:0 auto}
h1{font-size:24px;margin:4px 0 14px}h2{font-size:18px;margin:22px 0 10px}
.hint{color:var(--hint);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card.click{cursor:pointer}.card.click:active{opacity:.7}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.btn{display:block;width:100%;background:var(--btn);color:var(--btn-text);border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;margin-top:12px}
.btn.sec{background:var(--card);color:var(--text)}.btn:disabled{opacity:.5}
label{display:block;font-size:14px;color:var(--hint);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(128,128,128,.3);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600}
.chip.ok{background:#16a34a22;color:var(--ok)}.chip.warn{background:#d9770622;color:var(--warn)}.chip.gray{background:#8882;color:var(--hint)}
.bar{height:8px;background:#8883;border-radius:99px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--btn);border-radius:99px}
.av{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.grow{flex:1;min-width:0}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:10px}
.kpi b{display:block;font-size:18px}.kpi span{font-size:12px;color:var(--hint)}
.map{background:linear-gradient(#dcfce7,#bbf7d0);border-radius:18px;padding:6px;margin-bottom:6px}
@media(prefers-color-scheme:dark){.map{background:linear-gradient(#14532d,#166534)}}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid rgba(128,128,128,.2);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
#tabs button{flex:1;border:0;background:none;color:var(--hint);font-size:13px;padding:4px}#tabs button.on{color:var(--btn);font-weight:700}
#tabs button span{display:block;font-size:20px}
.toast{position:fixed;left:16px;right:16px;bottom:96px;background:#111c;color:#fff;padding:12px 14px;border-radius:12px;z-index:9;font-size:14px}
.spin{text-align:center;padding:60px 0;color:var(--hint)}
.err{background:#dc262622;color:#dc2626;padding:12px;border-radius:12px;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs">
  <button id="t-home" onclick="viewHome()"><span>🏆</span>Челленджи</button>
  <button id="t-profile" onclick="viewProfile()"><span>👤</span>Профиль</button>
</nav>

<script>
/* ───── НАСТРОЙКИ ───── */
const API_URL = 'https://script.google.com/macros/s/AKfycbzPuJf8E1qgz3MaLTJ3bt8P3N9-wwRpYobNnOconT21ptcMpxAW1mApSWaSy7p7ebXn/exec';             // URL деплоя Apps Script (.../exec)
const BOT_APP_LINK = 'https://t.me/YOUR_BOT/app';  // ссылка на Mini App: t.me/<бот>/<short_name>

/* ───── БАЗА ───── */
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GT = {lose:'Похудеть', gain:'Набрать массу', nutrition:'Питание по КБЖУ'};
const DIET = {cut:'Дефицит калорий', bulk:'Профицит калорий', maintain:'Поддержание'};
const ACTL = {low:'Сидячая работа, почти без спорта', light:'Лёгкая (1–3 тренировки/нед)', medium:'Средняя (3–5 тренировок/нед)', high:'Высокая (6–7 тренировок/нед)'};
const AVC = ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316'];
const col = s => AVC[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % AVC.length];
const ini = n => (String(n||'?').trim()[0]||'?').toUpperCase();
const fd = s => { const [,m,d] = s.split('-'); return d+'.'+m; };
const isoToday = () => new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDays = (n) => new Date(Date.now() - new Date().getTimezoneOffset()*6e4 + n*864e5).toISOString().slice(0,10);
let ME = null;

async function api(action, data = {}) {
  if (!tg.initData) throw new Error('Открой приложение через Telegram');
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({action, initData: tg.initData, ...data})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }
function setView(html){ $('#app').innerHTML = html; window.scrollTo(0,0); }
function loading(){ setView('<div class="spin">Загрузка…</div>'); }
function tab(name){
  ['home','profile'].forEach(k => $('#t-'+k).classList.toggle('on', k===name));
  if (name) { tg.BackButton.hide(); }
}
function sub(){ ['home','profile'].forEach(k => $('#t-'+k).classList.remove('on')); tg.BackButton.show(); }
tg.BackButton.onClick(() => viewHome());
async function run(fn){ try { await fn(); } catch(e){ setView(`<div class="err">${esc(e.message)}</div><button class="btn sec" onclick="viewHome()">На главную</button>`); } }
async function act(btn, fn){ btn.disabled = true; try { await fn(); } catch(e){ toast(e.message); } finally { btn.disabled = false; } }
const f = id => $('#'+id).value;

/* ───── ГЛАВНАЯ ───── */
async function viewHome(){ run(async () => {
  tab('home'); loading();
  if (!ME) ME = await api('me');
  const list = await api('listChallenges');
  setView(`<h1>Челленджи</h1>` + (list.length ? list.map(c => `
    <div class="card click" onclick="viewChallenge('${c.id}')">
      <div class="row between"><div class="name">${esc(c.name)}</div>
        ${c.finished ? '<span class="chip gray">завершён</span>' : c.joined ? (c.my && c.my.pending ? '<span class="chip warn">нужна цель</span>' : '<span class="chip ok">участвую</span>') : '<span class="chip gray">не участвую</span>'}</div>
      <div class="hint">${fd(c.start)} – ${fd(c.end)} · участников: ${c.count}</div>
      ${c.my && !c.my.pending ? `<div class="bar"><i style="width:${Math.round(c.my.progress*100)}%"></i></div>` : ''}
    </div>`).join('') : `<div class="card hint">Пока пусто. Создай челлендж и отправь ссылку друзьям — или открой приложение по ссылке от друга.</div>`)
    + `<button class="btn" onclick="viewCreate()">+ Создать челлендж</button>`);
});}

function viewCreate(){ sub(); setView(`<h1>Новый челлендж</h1>
  <label>Название</label><input id="c-name" maxlength="60" placeholder="Например: Осенний марафон">
  <label>Описание (необязательно)</label><textarea id="c-desc" maxlength="300"></textarea>
  <div class="grid2"><div><label>Старт</label><input id="c-start" type="date" value="${isoToday()}"></div>
  <div><label>Финиш</label><input id="c-end" type="date" value="${addDays(29)}"></div></div>
  <p class="hint">У каждого участника будет своя цель (похудеть, набрать, питание по КБЖУ), а рейтинг строится по % выполнения.</p>
  <button class="btn" onclick="doCreate(this)">Создать</button>`); }
function doCreate(b){ act(b, async () => {
  const r = await api('createChallenge', {name:f('c-name'), description:f('c-desc'), start:f('c-start'), end:f('c-end')});
  viewChallenge(r.id);
});}

/* ───── ЧЕЛЛЕНДЖ ───── */
async function viewChallenge(id){ run(async () => {
  sub(); loading();
  if (!ME) ME = await api('me');
  const d = await api('getChallenge', {id});
  const c = d.challenge, my = d.my;
  window._cname = c.name;
  const ranked = d.members.filter(m => !m.pending), pend = d.members.filter(m => m.pending);
  const link = `${BOT_APP_LINK}?startapp=${c.id}`;
  let myBlock = '';
  if (!d.joined) myBlock = c.finished ? '' : `<button class="btn" onclick="doJoin('${c.id}',this)">Участвовать</button>`;
  else if (!my.goal_type) myBlock = `<button class="btn" onclick="viewGoal('${c.id}')">🎯 Задать цель</button>`;
  else {
    const tgt = `<div class="kpi"><div><b>${my.kcal}</b><span>ккал</span></div><div><b>${my.protein}</b><span>белки, г</span></div><div><b>${my.fat}</b><span>жиры, г</span></div><div><b>${my.carbs}</b><span>углев., г</span></div></div>`;
    myBlock = `<h2>Моя цель</h2><div class="card">
      <div class="name">${GT[my.goal_type]}${my.goal_type!=='nutrition' ? `: ${my.start_weight} → ${my.target_weight} кг` : ` · ${DIET[my.diet]}`}</div>
      ${my.goal_type!=='nutrition' ? `<div class="hint">Сейчас: ${my.current_weight} кг</div>` : ''}
      ${my.explanation ? `<p class="hint">${esc(my.explanation)}</p>` : ''}
      <div class="hint" style="margin-top:8px">Норма на день (пересчитывается при смене веса):</div>${tgt}</div>
      ${c.finished ? '' : `<button class="btn" onclick="viewLog('${c.id}')">${my.todayLog ? '✏️ Изменить данные за сегодня' : '➕ Внести данные за сегодня'}</button>`}`;
  }
  setView(`<h1>${esc(c.name)}</h1>
    <div class="hint">${fd(c.start)} – ${fd(c.end)} · ${c.finished ? 'завершён' : 'осталось дней: ' + c.daysLeft}</div>
    ${c.description ? `<p>${esc(c.description)}</p>` : ''}
    <button class="btn sec" onclick="share('${link}')">🔗 Пригласить друзей</button>
    <h2>Карта</h2><div class="map"><svg id="map" viewBox="0 0 340 400" width="100%">
      <path id="road" d="M40 50 H300 A50 50 0 0 1 300 150 H40 A50 50 0 0 0 40 250 H300 A50 50 0 0 1 300 350 H40" fill="none" stroke="var(--road)" stroke-width="26" stroke-linecap="round"/>
      <path d="M40 50 H300 A50 50 0 0 1 300 150 H40 A50 50 0 0 0 40 250 H300 A50 50 0 0 1 300 350 H40" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
      <text x="40" y="20" text-anchor="middle" font-size="22">🚩</text><text x="40" y="392" text-anchor="middle" font-size="22">🏁</text>
    </svg></div>
    <div class="hint">Пунктирный круг «план» — где нужно быть сегодня, чтобы уложиться в срок.</div>
    ${myBlock}
    <h2>Рейтинг</h2>
    ${ranked.length ? ranked.map((m,i) => `<div class="card"><div class="row">
      <div style="width:22px;text-align:center">${['🥇','🥈','🥉'][i] || i+1}</div>
      <div class="av" style="background:${col(m.user_id)}">${esc(ini(m.name))}</div>
      <div class="grow"><div class="name">${esc(m.name)}${m.isMe?' (ты)':''}</div><div class="hint">${GT[m.goal_type]}</div>
      <div class="bar"><i style="width:${Math.round(m.progress*100)}%"></i></div></div>
      <div style="text-align:right"><b>${Math.round(m.progress*100)}%</b><br>
      <span class="chip ${m.onTrack?'ok':'warn'}">${m.onTrack?'в графике':'отстаёт'}</span></div></div></div>`).join('') : '<div class="card hint">Пока никто не задал цель.</div>'}
    ${pend.length ? `<div class="hint">Ещё без цели: ${pend.map(m=>esc(m.name)).join(', ')}</div>` : ''}`);
  drawMap(ranked, c.finished ? 1 : null, my && my.goal_type ? d.members.find(m=>m.isMe) : null);
});}

function drawMap(members, _f, mine){
  const NS='http://www.w3.org/2000/svg', svg=$('#map'), path=$('#road'), L=path.getTotalLength();
  const mk=(tag,attrs,txt)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;};
  [.25,.5,.75].forEach(k=>{const p=path.getPointAtLength(L*k);mk('circle',{cx:p.x,cy:p.y,r:4,fill:'#fff',opacity:.9});});
  if(mine){const p=path.getPointAtLength(L*mine.expected);
    mk('circle',{cx:p.x,cy:p.y,r:17,fill:'none',stroke:'#334155','stroke-width':2,'stroke-dasharray':'4 3'});
    mk('text',{x:p.x,y:p.y-22,'text-anchor':'middle','font-size':10,fill:'#334155','font-weight':700},'план');}
  const order=[...members].sort((a,b)=>a.isMe-b.isMe);
  order.forEach((m,i)=>{
    const p=path.getPointAtLength(L*m.progress), dy=((i%3)-1)*10;
    mk('circle',{cx:p.x,cy:p.y+dy,r:13,fill:col(m.user_id),stroke:m.isMe?'#111827':'#fff','stroke-width':m.isMe?3:2});
    mk('text',{x:p.x,y:p.y+dy+5,'text-anchor':'middle','font-size':13,fill:'#fff','font-weight':700},ini(m.name));
  });
}
function share(link){ tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Го на челлендж «'+window._cname+'»! Заходи и ставь свою цель 💪')); }
function doJoin(id,b){ act(b, async () => {
  if (!ME.complete) { toast('Сначала заполни профиль — по нему ИИ посчитает цель'); return viewProfile(id); }
  await api('join',{id}); viewGoal(id);
});}

/* ───── ПРОФИЛЬ ───── */
async function viewProfile(backTo){ run(async () => {
  tab('profile'); loading();
  ME = await api('me');
  setView(`<h1>Профиль</h1>
    <div class="row"><div class="av" style="background:${col(ME.name)}">${esc(ini(ME.name))}</div><div class="name">${esc(ME.name)}</div></div>
    <div class="grid2"><div><label>Рост, см</label><input id="p-h" type="number" inputmode="decimal" value="${esc(ME.height)}"></div>
    <div><label>Вес, кг</label><input id="p-w" type="number" inputmode="decimal" step="0.1" value="${esc(ME.weight)}"></div></div>
    <div class="grid2"><div><label>Возраст</label><input id="p-a" type="number" inputmode="numeric" value="${esc(ME.age)}"></div>
    <div><label>Пол</label><select id="p-s"><option value="">—</option><option value="m" ${ME.sex==='m'?'selected':''}>Мужской</option><option value="f" ${ME.sex==='f'?'selected':''}>Женский</option></select></div></div>
    <label>Активность</label><select id="p-act">${Object.entries(ACTL).map(([k,v])=>`<option value="${k}" ${ME.activity===k?'selected':''}>${v}</option>`).join('')}</select>
    <p class="hint">Вес обновляется автоматически, когда ты вносишь его в челленджах. Нормы ниже пересчитываются сами.</p>
    <button class="btn" onclick="saveProfile(this,${backTo?`'${backTo}'`:'null'})">Сохранить</button>
    <div id="norms">${normsHtml(ME)}</div>`);
});}
function normsHtml(p){
  if(!p.norms) return '<div class="card hint" style="margin-top:14px">Заполни данные — я посчитаю твои нормы.</div>';
  const n=p.norms, row=(t,x)=>`<div class="card"><div class="name">${t}</div><div class="kpi"><div><b>${x.kcal}</b><span>ккал</span></div><div><b>${x.protein}</b><span>белки</span></div><div><b>${x.fat}</b><span>жиры</span></div><div><b>${x.carbs}</b><span>углев.</span></div></div></div>`;
  return `<h2>Мои нормы</h2><div class="hint">ИМТ ${n.bmi} · базовый обмен ${n.bmr} ккал · расход с активностью ${n.tdee} ккал</div><div style="height:10px"></div>`
    + row('Поддержание',n.maintain) + row('Похудение (−20%)',n.cut) + row('Набор массы (+10%)',n.bulk);
}
function saveProfile(b,backTo){ act(b, async () => {
  ME = await api('saveProfile',{height:f('p-h'),weight:f('p-w'),age:f('p-a'),sex:f('p-s'),activity:f('p-act')});
  toast('Сохранено'); $('#norms').innerHTML = normsHtml(ME);
  if (backTo) viewChallenge(backTo);
});}

/* ───── ЦЕЛЬ (ИИ) ───── */
function viewGoal(id){ sub(); setView(`<h1>Твоя цель</h1>
  <p class="hint">Опиши словами, чего хочешь достичь за этот челлендж. ИИ учтёт твой рост, вес, возраст и срок и предложит реалистичную цель.</p>
  <textarea id="g-text" placeholder="Например: хочу сбросить лишнее к Новому году и перестать срываться на сладкое"></textarea>
  <button class="btn" onclick="askAI('${id}',this)">✨ Подсчитать с ИИ</button>
  <button class="btn sec" onclick="goalForm('${id}',{goal_type:'lose',diet:'cut',target_weight:'',targets:null,notes:[]},'','')">Задать вручную</button>
  <div id="g-res"></div>`); }
function askAI(id,b){ act(b, async () => {
  const r = await api('aiGoal',{id,text:f('g-text')});
  if (!r.ai) { toast(r.error); return; }
  goalForm(id, r.goal, r.explanation, f('g-text'));
});}
function goalForm(id,g,expl,text){
  window._goal = {expl, text};
  $('#g-res').innerHTML = `<h2>Предложение</h2>${expl?`<div class="card">${esc(expl)}</div>`:''}
    ${(g.notes||[]).map(n=>`<div class="card hint">⚠️ ${esc(n)}</div>`).join('')}
    <label>Тип цели</label><select id="g-type" onchange="goalToggle()">${Object.entries(GT).map(([k,v])=>`<option value="${k}" ${g.goal_type===k?'selected':''}>${v}</option>`).join('')}</select>
    <div id="g-tw-box"><label>Целевой вес, кг</label><input id="g-tw" type="number" inputmode="decimal" step="0.1" value="${esc(g.target_weight)}"></div>
    <div id="g-diet-box"><label>Режим питания</label><select id="g-diet">${Object.entries(DIET).map(([k,v])=>`<option value="${k}" ${g.diet===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div id="g-prev">${g.targets ? prevHtml(g.targets) : ''}</div>
    <div class="hint" style="margin-top:8px">Можно поправить руками — сервер проверит, что цель безопасна.</div>
    <button class="btn sec" onclick="goalPreview('${id}',this)">Пересчитать</button>
    <button class="btn" onclick="goalSave('${id}',this)">Принять цель</button>`;
  goalToggle();
}
function prevHtml(t){ return `<div class="card" style="margin-top:12px"><div class="hint">Норма на день</div><div class="kpi"><div><b>${t.kcal}</b><span>ккал</span></div><div><b>${t.protein}</b><span>белки</span></div><div><b>${t.fat}</b><span>жиры</span></div><div><b>${t.carbs}</b><span>углев.</span></div></div></div>`; }
function goalToggle(){ const n=f('g-type')==='nutrition'; $('#g-tw-box').style.display=n?'none':''; $('#g-diet-box').style.display=n?'':'none'; }
function goalPayload(id,extra){ return {id,goal_type:f('g-type'),diet:f('g-diet'),target_weight:f('g-tw'),goal_text:window._goal.text,explanation:window._goal.expl,...extra}; }
function goalPreview(id,b){ act(b, async () => {
  const g = await api('saveGoal', goalPayload(id,{dry:true}));
  if (g.notes.length) toast(g.notes[0]);
  if (g.target_weight!=='') $('#g-tw').value = g.target_weight;
  $('#g-prev').innerHTML = prevHtml(g.targets);
});}
function goalSave(id,b){ act(b, async () => {
  const g = await api('saveGoal', goalPayload(id,{}));
  if (g.notes.length) toast(g.notes[0]);
  viewChallenge(id);
});}

/* ───── ЕЖЕДНЕВНЫЙ ВВОД ───── */
async function viewLog(id){ run(async () => {
  sub(); loading();
  const d = await api('getChallenge',{id}), my = d.my, t = my.todayLog || {};
  const v = k => esc(t[k] ?? '');
  const macro = `<div class="grid2"><div><label>Белки, г</label><input id="l-p" type="number" inputmode="decimal" value="${v('protein')}"></div><div><label>Жиры, г</label><input id="l-f" type="number" inputmode="decimal" value="${v('fat')}"></div></div>
    <label>Углеводы, г</label><input id="l-c" type="number" inputmode="decimal" value="${v('carbs')}">`;
  setView(`<h1>Данные за сегодня</h1><div class="hint">${GT[my.goal_type]} · норма: ${my.kcal} ккал (Б ${my.protein} / Ж ${my.fat} / У ${my.carbs})</div>
    ${my.goal_type!=='nutrition' ? `<label>Вес утром, кг</label><input id="l-w" type="number" inputmode="decimal" step="0.1" value="${v('weight') || esc(my.current_weight)}">` : ''}
    <label>Калории за день${my.goal_type==='nutrition'?'':' (необязательно)'}</label><input id="l-k" type="number" inputmode="numeric" value="${v('kcal')}">
    ${macro}
    <p class="hint">${my.goal_type==='nutrition' ? 'День засчитывается, если калории в пределах ±10% от нормы.' : 'Новый вес сразу обновится и в профиле.'}</p>
    <button class="btn" onclick="saveLog('${id}','${my.goal_type}',this)">Сохранить</button>`);
});}
function saveLog(id,type,b){ act(b, async () => {
  const q = {id, kcal:f('l-k'), protein:f('l-p'), fat:f('l-f'), carbs:f('l-c')};
  if (type!=='nutrition') q.weight = f('l-w');
  await api('log', q); ME = null; toast('Записано ✅'); viewChallenge(id);
});}

/* ───── СТАРТ ───── */
(function(){
  const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && /^[A-Za-z0-9_-]+$/.test(sp)) viewChallenge(sp); else viewHome();
})();
</script>
